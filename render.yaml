# Render Blueprint — free API tier (no credit card required).
#
# Topology:
#   Cloudflare Pages  -> React SPA (free, no card)
#   Render free web   -> Docker image with gateway + FastAPI
#   Neon free Postgres -> DATABASE_URL (permanent free plan, no card)
#
# Free-tier caveats (verified Nov 2026):
#   - Render free web services sleep after 15 minutes idle (~1 min cold start)
#     and have 512 MB RAM / 0.1 CPU / 750 instance hours per workspace/month.
#   - Neon Free is permanent, no card, 1 GB storage and 100 CU-hours/project.
#   - Cloudflare Pages static hosting is free with unlimited requests.
# Do not use Render's free Postgres here: it expires after 30 days.

envVarGroups:
  - name: erp-api-shared
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: TZ
        value: Asia/Riyadh
      - key: CACHE_ENABLED
        value: "false"
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MAX_OVERFLOW
        value: "2"
      - key: PG_POOL_MAX
        value: "5"
      # Exact production origin. ALLOW_PAGES_DEV also accepts the generated
      # <project>.pages.dev preview URLs until you replace this value.
      - key: CORS_ORIGINS
        value: https://erp-frontend.pages.dev
      - key: ALLOW_PAGES_DEV
        value: "true"
      - key: CF_PAGES_PROJECT
        value: erp-frontend

services:
  - type: web
    name: erp-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./web/Dockerfile.api
    dockerContext: ./web
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - fromGroup: erp-api-shared
      # Paste the Neon connection string (postgresql://...sslmode=require).
      # Both the gateway and FastAPI use this same value.
      - key: DATABASE_URL
        sync: false
      - key: PYTHON_BACKEND_URL
        value: http://127.0.0.1:8001
      - key: BOOTSTRAP_ADMIN_USERNAME
        value: admin
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: BOOTSTRAP_ADMIN_FULL_NAME
        value: System Administrator
