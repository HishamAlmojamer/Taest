

v
ersion: '3.8'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: warehouse_management
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d warehouse_management"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: >
      sh -c "alembic upgrade head 2>/dev/null || true &&
             uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/warehouse_management
      JWT_SECRET: erp-super-secret-key-2024
      DEBUG: "true"
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/__pycache__

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    command: npm run dev
    environment:
      PORT: "3001"
      JWT_SECRET: erp-super-secret-key-2024
      PYTHON_BACKEND_URL: http://backend:8001
      CORS_ORIGINS: http://localhost:5173,http://localhost:3001
    ports:
      - "3001:3001"
    depends_on:
      - backend
    volumes:
      - ./gateway:/app
      - /app/node_modules

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "5173:5173"
    depends_on:
      - gateway
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  pgdata:
